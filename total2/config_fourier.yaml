name: Syn2Seq_Keypoint_FeatureFourier
dataset:
  root: /data/data3/kuanghaohong/datasets/DexYCB
  setup: s0
  seq_len: 16
  num_views: 8
  exo_views: [0]
  ego_views: [5, 6, 7]
  num_joints: 21
  image_size: [256, 256]
  use_spatiotemporal: false
  use_fused_features: true
model:
  hidden_dim: 256
  num_layers: 6
  num_heads: 8
  dropout: 0.1
  interpolate_steps: 4
  fourier_threshold: 0.1
  pose_dim: 12
training:
  batch_size: 4
  lr: 0.0001
  weight_decay: 0.0001
  num_epochs: 50
  device: cuda
  log_interval: 10
  save_interval: 5
data:
  num_workers: 4
  pin_memory: true
