name: Syn2Seq_Forcing

dataset:
  name: dexycb
  root: /data/data3/kuanghaohong/datasets/DexYCB
  seq_len: 16
  image_size: [128, 128]
  num_joints: 21
  exo_views: [0]
  ego_views: [5, 6, 7]

model:
  hidden_dim: 256
  num_heads: 8
  num_layers: 6
  dropout: 0.1
  patch_size: 8
  num_interp_frames: 16  # 插值帧数=seq_len

training:
  batch_size: 2
  num_epochs: 50
  lr: 0.0001
  weight_decay: 0.0001
  device: cuda
  save_interval: 5
  output_dir: ./outputs/syn2seq

data:
  num_workers: 0
